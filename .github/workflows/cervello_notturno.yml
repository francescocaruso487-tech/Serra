name: 🧠 Cervello Notturno v2

on:
  schedule:
    - cron: '0 0 * * *'   # Mezzanotte — connessioni nuove
    - cron: '0 6 * * *'   # 6:00 — analisi mattutina
    - cron: '0 12 * * *'  # 12:00 — aggiornamento midday
    - cron: '0 18 * * *'  # 18:00 — serale
  workflow_dispatch:
    inputs:
      max_connessioni:
        description: 'Numero massimo connessioni da generare'
        default: '6'

jobs:
  cervello:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Dipendenze
        run: pip install pymupdf requests 2>/dev/null || pip install requests
      - name: 🧠 Esegui Cervello
        run: python scripts/cervello_notturno.py
      - name: 💾 Commit
        run: |
          git config user.name "🧠 Cervello Serra"
          git config user.email "cervello@serra.local"
          git add manuali/esperimenti_database.json scripts/cervello_log.json || true
          git diff --staged --quiet || git commit -m "🧠 [$(date '+%H:%M')] +connessioni dai manuali Drive"
          git push
