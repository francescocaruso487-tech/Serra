name: 🧠 Cervello Notturno — Analisi PDF e Connessioni

on:
  schedule:
    # Ogni notte a mezzanotte (UTC)
    - cron: '0 0 * * *'
  # Permette anche esecuzione manuale dal pannello GitHub
  workflow_dispatch:

jobs:
  analisi:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Per poter fare commit nel repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installa dipendenze
        run: |
          pip install pymupdf

      - name: 🧠 Esegui analisi notturna
        run: |
          python scripts/cervello_notturno.py

      - name: 📊 Verifica risultati
        run: |
          echo "=== Statistiche aggiornamento ==="
          python -c "
          import json
          db = json.load(open('manuali/esperimenti_database.json'))
          print(f'Connessioni totali: {len(db[\"connessioni\"])}')
          print(f'Categorie: {len(db[\"categorie\"])}')
          esps = sum(len(c[\"esperimenti\"]) for c in db[\"categorie\"])
          print(f'Esperimenti: {esps}')
          # Mostra le ultime connessioni aggiunte
          ultime = db[\"connessioni\"][-5:]
          print(\"\\nUltime 5 connessioni:\")
          for c in ultime:
              print(f'  {c.get(\"a\",\"\")[:40]} ↔ {c.get(\"b\",\"\")[:40]}')
          "

      - name: 💾 Commit e push aggiornamenti
        run: |
          git config user.name "🧠 Cervello Notturno"
          git config user.email "cervello@serra-bot.local"
          git add manuali/esperimenti_database.json
          git add scripts/cervello_log.json || true
          # Commit solo se ci sono modifiche
          git diff --staged --quiet || git commit -m "🧠 Analisi notturna: nuove connessioni dai 58 manuali [$(date '+%Y-%m-%d')]"
          git push
